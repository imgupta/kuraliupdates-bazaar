server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: kuraliupdates-bazaar-service

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${ORACLE_USERNAME:kurali_admin}
    password: ${ORACLE_PASSWORD:kurali_secure_pwd}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: KuraliHikariPool

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update # or 'validate' in production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  sql:
    init:
      mode: always # runs schema-oracle.sql and data-oracle.sql on first startup

# Security & CORS configuration for Angular frontend
app:
  cors:
    allowed-origins: "http://localhost:4200,https://kuraliupdates.com,https://www.kuraliupdates.com"
  jwt:
    secret: "KuraliBazaarSecretKey2026PunjabLocalCommerceSecureJWTKeyMustBeAtLeast256Bits"
    expiration-ms: 86400000 # 24 hours

# Swagger / OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
