server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: kuraliupdates-bazaar-service
  main:
    lazy-initialization: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      initialization-fail-timeout: 30000
      max-lifetime: 1200000
      pool-name: KuraliHikariPool
      data-source-properties:
        oracle.net.wallet_location: (SOURCE=(METHOD=FILE)(METHOD_DATA=(DIRECTORY=${ORACLE_WALLET_DIR:/etc/secrets})))
        oracle.net.tns_admin: ${ORACLE_WALLET_DIR:/etc/secrets}
        javax.net.ssl.trustStore: ${ORACLE_WALLET_DIR:/etc/secrets}/truststore.jks
        javax.net.ssl.trustStorePassword: ${WALLET_PASSWORD}
        javax.net.ssl.keyStore: ${ORACLE_WALLET_DIR:/etc/secrets}/keystore.jks
        javax.net.ssl.keyStorePassword: ${WALLET_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

app:
  flyway:
    repair-before-migrate: ${FLYWAY_REPAIR_BEFORE_MIGRATE:false}
  otp:
    email:
      from: ${OTP_EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      country-code: ${MSG91_COUNTRY_CODE:91}
  cors:
    allowed-origins: "http://localhost:4200,https://kuraliupdates.com,https://www.kuraliupdates.com,https://*.vercel.app,*"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
