server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: kuraliupdates-bazaar-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  main:
    # Defer non-essential bean creation so the HTTP server can bind within Render's startup window.
    lazy-initialization: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      initialization-fail-timeout: 30000
      max-lifetime: 1200000
      pool-name: KuraliHikariPool
      connection-init-sql: ALTER SESSION DISABLE PARALLEL DML
      data-source-properties:
        # Walletless TLS: server identity is verified by the TCPS connection descriptor.
        oracle.net.ssl_server_dn_match: true
        # Bound Oracle Net connection establishment and socket reads.
        oracle.net.CONNECT_TIMEOUT: 10000
        oracle.net.OUTBOUND_CONNECT_TIMEOUT: 15000
        oracle.jdbc.ReadTimeout: 20000
        oracle.net.keepAlive: true
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 13
    ignore-migration-patterns: "*:missing"

# Targeted startup diagnostics. Keep HikariConfig at WARN because its DEBUG
# configuration dump includes data-source properties such as wallet_password.
logging:
  level:
    com.zaxxer.hikari: INFO
    com.zaxxer.hikari.HikariConfig: WARN
    com.zaxxer.hikari.pool.HikariPool: DEBUG
    org.flywaydb: DEBUG
    org.springframework.jdbc: INFO

app:
  document-scanner:
    clamav:
      host: ${CLAMAV_HOST:}
      port: ${CLAMAV_PORT:3310}
      timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
  otp:
    email:
      from: ${OTP_EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      country-code: ${MSG91_COUNTRY_CODE:91}
  cors:
    allowed-origins: "http://localhost:4200,https://kuraliupdates.com,https://www.kuraliupdates.com,https://*.vercel.app,*"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
