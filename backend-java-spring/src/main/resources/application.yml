server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: kuraliupdates-bazaar-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  main:
    # Defer non-essential bean creation so the HTTP server can bind within Render's startup window.
    lazy-initialization: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@jkphg8mg7fvt8c2n_high?TNS_ADMIN=/app/wallet}
    username: ${ORACLE_USERNAME:ADMIN}
    password: ${ORACLE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      initialization-fail-timeout: 30000
      max-lifetime: 1200000
      pool-name: KuraliHikariPool
      data-source-properties:
        oracle.net.wallet_location: (SOURCE=(METHOD=FILE)(METHOD_DATA=(DIRECTORY=/app/wallet)))
        oracle.net.tns_admin: /app/wallet
        javax.net.ssl.trustStore: /app/wallet/truststore.jks
        javax.net.ssl.trustStorePassword: ${WALLET_PASSWORD:Vasu@123!2026}
        javax.net.ssl.keyStore: /app/wallet/keystore.jks
        javax.net.ssl.keyStorePassword: ${WALLET_PASSWORD:Vasu@123!2026}
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    # Existing staging schema is at version 13. Keep older migration history
    # records even though the repository now retains only the current migration.
    baseline-on-migrate: true
    baseline-version: 13
    ignore-migration-patterns: "*:missing"
app:
  otp:
    email:
      from: ${OTP_EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      country-code: ${MSG91_COUNTRY_CODE:91}
  cors:
    allowed-origins: "http://localhost:4200,https://kuraliupdates.com,https://www.kuraliupdates.com,https://*.vercel.app,*"
  jwt:
    secret: "KuraliBazaarSecretKey2026PunjabLocalCommerceSecureJWTKeyMustBeAtLeast256Bits"
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
