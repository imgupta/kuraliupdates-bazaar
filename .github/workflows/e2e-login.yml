name: KuraliUpdates CI and E2E

on:
  pull_request:
    branches: [main]
    # Skip expensive CI when a change contains only documentation. Mixed docs/code
    # changes still run the full workflow because paths-ignore only skips when all
    # changed paths match these patterns.
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  actions: read
  contents: read

# All refs share one E2E concurrency lane because role identities and OTP cooldowns
# are shared by the single staging environment. Queue runs instead of racing OTP sends.
concurrency:
  group: kuraliupdates-single-staging-e2e
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install
      - name: Install Playwright test runner
        run: bun add --dev @playwright/test
      - name: TypeScript checks
        run: bun run lint
      - name: Frontend route registry regression tests
        run: node --import tsx --test tests/routeConfig.test.ts
      - name: Role route access policy regression tests
        run: node --import tsx --test tests/roleRouteAccess.test.ts
      - name: Cross-portal redirect regression tests
        run: node --import tsx --test tests/portalRedirect.test.ts
      - name: Saved address mapping regression tests
        run: node --import tsx --test tests/savedAddress.test.ts
      - name: User profile mapping regression tests
        run: node --import tsx --test tests/userProfile.test.ts
      - name: Seller product mapping regression tests
        run: node --import tsx --test tests/sellerProduct.test.ts
      - name: Frontend module-boundary regression tests
        run: node --import tsx --test tests/moduleBoundaries.test.ts
      - name: Public role-portal entry point regression tests
        run: node --import tsx --test tests/portalEntryPoints.test.ts
      - name: Delivery OTP input validator regression
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const src=fs.readFileSync('src/features/delivery/DeliveryPortal.tsx','utf8'); if (!src.includes('/^\\\\d{4}$/.test(enteredOtp.trim())')) { console.error('Delivery OTP validator must accept exactly four digits.'); process.exit(1); } if (src.includes('/^\\\\\\\\d{4}$/.test(enteredOtp.trim())')) { console.error('Delivery OTP validator is over-escaped.'); process.exit(1); }"
      - name: Shared application production build
        run: bun run build
      - name: Portal build-impact policy regression tests
        run: node --test tests/portalBuildImpact.test.mjs
      - name: Build only affected role portals
        run: bun run build:affected-portals

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run focused regressions
        working-directory: backend-java-spring
        run: mvn --batch-mode --no-transfer-progress -Dtest=DeliveryServiceTest,DeliveryTrackingServiceTest,HealthControllerTest,BuyerAddressServiceTest,DailyHelpServiceTest,AuthRegistrationCheckTest test
      - name: Compile and run full backend verification suite
        working-directory: backend-java-spring
        run: mvn --batch-mode --no-transfer-progress clean verify

  e2e:
    name: Browser E2E and read-only smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # Fixed allowlisted staging targets stay in workflow code; all E2E settings/identities/fixtures/secrets live in one Actions secret JSON.
      E2E_BASE_URL: "https://bazaar.kuraliupdates.com"
      E2E_API_BASE_URL: "https://kuraliupdates-bazaar.onrender.com/api/v1"
      KURALI_API_BASE_URL: "https://kuraliupdates-bazaar.onrender.com/api/v1"
      E2E_STAGING_CONFIG_JSON: ${{ secrets.E2E_STAGING_CONFIG_JSON }}
      SMOKE_READINESS_TIMEOUT_MS: "360000"
      SMOKE_RETRY_INTERVAL_MS: "10000"
      SMOKE_TIMEOUT_MS: "45000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install
      - name: Install Playwright test runner
        run: bun add --dev @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Load consolidated E2E JSON configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = process.env.E2E_STAGING_CONFIG_JSON;
          if (!raw?.trim()) {
            console.error('Missing GitHub Actions secret E2E_STAGING_CONFIG_JSON.');
            process.exit(1);
          }
          let config;
          try { config = JSON.parse(raw); } catch {
            console.error('E2E_STAGING_CONFIG_JSON is not valid JSON.');
            process.exit(1);
          }
          if (!config || typeof config !== 'object' || Array.isArray(config)) {
            console.error('E2E_STAGING_CONFIG_JSON must be a JSON object.');
            process.exit(1);
          }
          const allowed = [
            'E2E_ENVIRONMENT', 'E2E_OTP_CAPTURE_TOKEN', 'E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED',
            'E2E_TRANSACTIONAL_FLOWS_ENABLED', 'E2E_FLOW_AUTH_TOKEN',
            'E2E_BUYER_IDENTITY', 'E2E_SELLER_IDENTITY', 'E2E_DELIVERY_IDENTITY',
            'E2E_PROVIDER_IDENTITY', 'E2E_ADMIN_IDENTITY',
            'E2E_FLOW_BUYER_PHONE', 'E2E_FLOW_BUYER_EMAIL',
            'E2E_FLOW_PRODUCT_ID', 'E2E_FLOW_SELLER_ID', 'E2E_FLOW_DELIVERY_AGENT_ID',
            'E2E_FLOW_ORDER_QUANTITY', 'E2E_FLOW_DAILY_HELP_SERVICE_ID',
            'E2E_FLOW_DAILY_HELP_SLOT_ID', 'E2E_FLOW_PROFESSIONAL_ID',
            'E2E_FLOW_DAILY_HELP_START', 'E2E_FLOW_DAILY_HELP_HOURS'
          ];
          const bools = new Set(['E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED', 'E2E_TRANSACTIONAL_FLOWS_ENABLED']);
          const lines = [];
          for (const key of allowed) {
            let value = config[key];
            if (value === undefined || value === null) value = '';
            if (typeof value !== 'string' && typeof value !== 'number' && typeof value !== 'boolean') {
              console.error('Invalid value type for configuration key ' + key);
              process.exit(1);
            }
            value = String(value);
            if (value.includes('\n') || value.includes('\r')) {
              console.error('Newlines are not permitted in configuration key ' + key);
              process.exit(1);
            }
            if (bools.has(key) && !['', 'true', 'false'].includes(value)) {
              console.error('Boolean configuration key ' + key + ' must be true or false');
              process.exit(1);
            }
            if (key === 'E2E_ENVIRONMENT' && value && value !== 'staging') {
              console.error('E2E_ENVIRONMENT must be staging');
              process.exit(1);
            }
            lines.push(key + '=' + value);
          }
          // Trusted-event gate: config cannot enable mutating or OTP-login tests on PR/push.
          const event = process.env.GITHUB_EVENT_NAME;
          const trusted = event === 'schedule' || event === 'workflow_dispatch';
          const values = Object.fromEntries(lines.map(line => [line.slice(0, line.indexOf('=')), line.slice(line.indexOf('=') + 1)]));
          values.E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED = trusted && values.E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED === 'true' ? 'true' : 'false';
          values.E2E_TRANSACTIONAL_FLOWS_ENABLED = trusted && values.E2E_TRANSACTIONAL_FLOWS_ENABLED === 'true' ? 'true' : 'false';
          // These token values are nested inside a JSON secret, so GitHub does not mask them individually.
          // Register masks before exporting them for later steps, without changing the configured secrets.
          for (const key of ['E2E_OTP_CAPTURE_TOKEN', 'E2E_FLOW_AUTH_TOKEN']) {
            const value = values[key];
            if (value) console.log('::add-mask::' + value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([k,v]) => k + '=' + v).join('\n') + '\n');
          console.log('Loaded consolidated E2E configuration; secret values were not printed.');
          NODE
      - name: Guard E2E target is the designated staging site
        run: |
          node --input-type=module -e "const u=new URL(process.env.E2E_BASE_URL); if (u.protocol !== 'https:' || u.hostname !== 'bazaar.kuraliupdates.com') { console.error('Refusing E2E against a non-staging host'); process.exit(1); }"
      - name: Guard API smoke target is the designated staging API
        if: env.KURALI_API_BASE_URL != ''
        run: |
          node --input-type=module -e "const u=new URL(process.env.KURALI_API_BASE_URL); if (u.protocol !== 'https:' || u.hostname !== 'kuraliupdates-bazaar.onrender.com' || u.pathname.replace(/\\/+$/, '') !== '/api/v1') { console.error('Refusing API smoke against a non-designated staging API'); process.exit(1); }"
      - name: Run read-only API smoke checks
        if: env.KURALI_API_BASE_URL != ''
        run: node scripts/production-smoke.mjs
      - name: Verify authenticated E2E configuration is complete
        run: |
          node --input-type=module -e "const env=process.env; if(env.E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED!=='true'){console.log('Skipping authenticated OTP E2E: staging no-email OTP capture mode has not been explicitly verified.');process.exit(0)} const required=['E2E_BUYER_IDENTITY','E2E_SELLER_IDENTITY','E2E_DELIVERY_IDENTITY','E2E_PROVIDER_IDENTITY','E2E_ADMIN_IDENTITY']; const missing=required.filter(k=>!env[k]?.trim()); const api=new URL(env.E2E_API_BASE_URL); const valid=env.E2E_ENVIRONMENT==='staging' && api.protocol==='https:' && api.hostname==='kuraliupdates-bazaar.onrender.com' && api.pathname==='/api/v1' && (env.E2E_OTP_CAPTURE_TOKEN||'').length>=32; if(!valid||missing.length){console.error('Authenticated E2E is not configured. Check staging targets, no-email confirmation, OTP token length, and all five role identity secrets. Missing identities:',missing.join(', ')||'none');process.exit(1)} console.log('Authenticated E2E configuration present for all five roles; staging no-email mode was explicitly confirmed.');"
      - name: Verify static flow-token configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$E2E_TRANSACTIONAL_FLOWS_ENABLED" != "true" ]; then
            echo "Static flow-token exchange is not required while transactional E2E is disabled."
            exit 0
          fi
          test "$E2E_ENVIRONMENT" = "staging" || { echo "Refusing static flow-token exchange unless E2E_ENVIRONMENT=staging"; exit 1; }
          test "${#E2E_FLOW_AUTH_TOKEN}" -ge 32 || { echo "Set the E2E_FLOW_AUTH_TOKEN GitHub secret to a random value of at least 32 characters."; exit 1; }
          for key in E2E_BUYER_IDENTITY E2E_SELLER_IDENTITY E2E_DELIVERY_IDENTITY E2E_PROVIDER_IDENTITY; do
            test -n "${!key:-}" || { echo "Missing required role identity secret: $key"; exit 1; }
          done
          echo "Static E2E flow-auth secret and role identities are configured."
      - name: Verify transactional lifecycle fixture configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$E2E_TRANSACTIONAL_FLOWS_ENABLED" != "true" ]; then
            echo "Transactional order and Daily Help E2E is disabled; no test transactions will be created."
            exit 0
          fi
          test "$E2E_ENVIRONMENT" = "staging" || { echo "Refusing transactional E2E unless E2E_ENVIRONMENT=staging"; exit 1; }
          test "$E2E_API_BASE_URL" = "https://kuraliupdates-bazaar.onrender.com/api/v1" || { echo "Refusing transactional E2E against an unapproved API"; exit 1; }
          required=(E2E_FLOW_AUTH_TOKEN E2E_BUYER_IDENTITY E2E_SELLER_IDENTITY E2E_DELIVERY_IDENTITY E2E_PROVIDER_IDENTITY E2E_FLOW_BUYER_PHONE E2E_FLOW_BUYER_EMAIL E2E_FLOW_PRODUCT_ID E2E_FLOW_SELLER_ID E2E_FLOW_DELIVERY_AGENT_ID E2E_FLOW_ORDER_QUANTITY E2E_FLOW_DAILY_HELP_SERVICE_ID E2E_FLOW_DAILY_HELP_SLOT_ID E2E_FLOW_PROFESSIONAL_ID E2E_FLOW_DAILY_HELP_START E2E_FLOW_DAILY_HELP_HOURS)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Transactional E2E enabled but missing required secrets/variables: %s\n' "${missing[*]}"
            exit 1
          fi
          for name in E2E_FLOW_PRODUCT_ID E2E_FLOW_SELLER_ID E2E_FLOW_DELIVERY_AGENT_ID E2E_FLOW_DAILY_HELP_SERVICE_ID E2E_FLOW_DAILY_HELP_SLOT_ID E2E_FLOW_PROFESSIONAL_ID; do
            value="${!name}"
            if [[ ! "$value" =~ ^E2E-[A-Za-z0-9_-]{3,80}$ ]]; then
              echo "$name must be a dedicated synthetic ID beginning E2E-; refusing to run."
              exit 1
            fi
          done
          echo "Transactional E2E configuration present. Tests will create only run-scoped synthetic order/booking records; no cleanup or deletion is performed."
      - name: Run browser E2E tests
        run: bunx playwright test
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-playwright-report:
    name: Publish private Playwright report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    # Never publish artifacts produced by pull-request code. This runs only for trusted
    # main-branch push, schedule, or manual runs, and only after Access protection is confirmed.
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_REPORT_ACCESS_CONFIGURED == 'true' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing repository variable CLOUDFLARE_PAGES_PROJECT"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          echo "Cloudflare credentials are present; report access-protection confirmation is enabled."
      - name: Download report artifact from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: playwright-e2e-report
          path: downloaded-artifact
      - name: Prepare report-only site
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded-artifact/playwright-report/index.html || {
            echo "The artifact does not contain playwright-report/index.html."
            echo "Check the E2E job's Upload Playwright report and traces step."
            exit 1
          }
          mkdir -p site
          cp -a downloaded-artifact/playwright-report/. site/
          test -s site/index.html
          echo "Prepared the HTML report and its supporting assets. test-results and traces are not published."
      - name: Deploy report to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 pages project list 2>&1 | tee /tmp/cloudflare-pages-projects.log | grep -Fq "$CLOUDFLARE_PAGES_PROJECT"; then
            echo "Cloudflare Pages project not found; creating $CLOUDFLARE_PAGES_PROJECT."
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main
          fi
          npx --yes wrangler@4 pages deploy ./site --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main 2>&1 | tee /tmp/cloudflare-pages-deploy.log
          REPORT_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/cloudflare-pages-deploy.log | tail -n 1 || true)"
          {
            echo "## Playwright HTML report"
            echo
            echo "The report-only site was deployed after a trusted main-branch run."
            echo "Access is expected to be restricted by the Cloudflare Access configuration confirmed in repository variable `CLOUDFLARE_REPORT_ACCESS_CONFIGURED=true`."
            if [ -n "$REPORT_URL" ]; then
              echo
              echo "Deployment URL: $REPORT_URL"
            else
              echo
              echo "See the Cloudflare Pages deployment output for the deployment URL."
            fi
            echo
            echo "Only the HTML report folder was deployed; test-results and trace files were excluded."
          } >> "$GITHUB_STEP_SUMMARY"
