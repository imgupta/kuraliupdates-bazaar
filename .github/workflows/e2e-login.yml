name: End-to-end login tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL (use an isolated staging environment for data-changing tests)"
        required: true
        default: "https://bazaar.kuraliupdates.com"
        type: string
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: e2e-login-tests
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      E2E_BASE_URL: ${{ inputs.base_url || 'https://bazaar.kuraliupdates.com' }}
      E2E_BUYER_IDENTITY: ${{ secrets.E2E_BUYER_IDENTITY }}
      E2E_BUYER_OTP: ${{ secrets.E2E_BUYER_OTP }}
      E2E_SELLER_IDENTITY: ${{ secrets.E2E_SELLER_IDENTITY }}
      E2E_SELLER_OTP: ${{ secrets.E2E_SELLER_OTP }}
      E2E_DELIVERY_IDENTITY: ${{ secrets.E2E_DELIVERY_IDENTITY }}
      E2E_DELIVERY_OTP: ${{ secrets.E2E_DELIVERY_OTP }}
      E2E_PROVIDER_IDENTITY: ${{ secrets.E2E_PROVIDER_IDENTITY }}
      E2E_PROVIDER_OTP: ${{ secrets.E2E_PROVIDER_OTP }}
      E2E_ADMIN_IDENTITY: ${{ secrets.E2E_ADMIN_IDENTITY }}
      E2E_ADMIN_OTP: ${{ secrets.E2E_ADMIN_OTP }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun add --dev @playwright/test
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
