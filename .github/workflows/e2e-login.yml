name: KuraliUpdates CI and E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: kuraliupdates-ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install
      - name: Install Playwright test runner
        run: bun add --dev @playwright/test
      - name: TypeScript checks
        run: bun run lint
      - name: Frontend route registry regression tests
        run: node --import tsx --test tests/routeConfig.test.ts
      - name: Role route access policy regression tests
        run: node --import tsx --test tests/roleRouteAccess.test.ts
      - name: Saved address mapping regression tests
        run: node --import tsx --test tests/savedAddress.test.ts
      - name: User profile mapping regression tests
        run: node --import tsx --test tests/userProfile.test.ts
      - name: Seller product mapping regression tests
        run: node --import tsx --test tests/sellerProduct.test.ts
      - name: Delivery OTP input validator regression
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const src=fs.readFileSync('src/components/Delivery/DeliveryDashboard.tsx','utf8'); if (!src.includes('/^\\\\d{4}$/.test(enteredOtp.trim())')) { console.error('Delivery OTP validator must accept exactly four digits.'); process.exit(1); } if (src.includes('/^\\\\\\\\d{4}$/.test(enteredOtp.trim())')) { console.error('Delivery OTP validator is over-escaped.'); process.exit(1); }"
      - name: Production build
        run: bun run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run focused regressions
        working-directory: backend-java-spring
        run: mvn --batch-mode --no-transfer-progress -Dtest=DeliveryServiceTest,DeliveryTrackingServiceTest,HealthControllerTest,BuyerAddressServiceTest,DailyHelpServiceTest,AuthRegistrationCheckTest test
      - name: Compile and run full backend verification suite
        working-directory: backend-java-spring
        run: mvn --batch-mode --no-transfer-progress clean verify

  e2e:
    name: Browser E2E and read-only smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # This repository has one deployed environment, designated staging by the owner.
      # Never allow a manual input to redirect authenticated tests to an arbitrary/production host.
      E2E_ENVIRONMENT: ${{ vars.E2E_ENVIRONMENT }}
      E2E_BASE_URL: "https://bazaar.kuraliupdates.com"
      E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
      E2E_OTP_CAPTURE_TOKEN: ${{ secrets.E2E_OTP_CAPTURE_TOKEN }}
      E2E_BUYER_IDENTITY: ${{ secrets.E2E_BUYER_IDENTITY }}
      E2E_SELLER_IDENTITY: ${{ secrets.E2E_SELLER_IDENTITY }}
      E2E_DELIVERY_IDENTITY: ${{ secrets.E2E_DELIVERY_IDENTITY }}
      E2E_PROVIDER_IDENTITY: ${{ secrets.E2E_PROVIDER_IDENTITY }}
      E2E_ADMIN_IDENTITY: ${{ secrets.E2E_ADMIN_IDENTITY }}
      KURALI_API_BASE_URL: ${{ vars.KURALI_API_BASE_URL || vars.KURALI_STAGING_API_BASE_URL || 'https://kuraliupdates-bazaar.onrender.com/api/v1' }}
      SMOKE_READINESS_TIMEOUT_MS: "360000"
      SMOKE_RETRY_INTERVAL_MS: "10000"
      SMOKE_TIMEOUT_MS: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install
      - name: Install Playwright test runner
        run: bun add --dev @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Guard E2E target is the designated staging site
        run: |
          node --input-type=module -e "const u=new URL(process.env.E2E_BASE_URL); if (u.protocol !== 'https:' || u.hostname !== 'bazaar.kuraliupdates.com') { console.error('Refusing E2E against a non-staging host'); process.exit(1); }"
      - name: Guard API smoke target is the designated staging API
        if: env.KURALI_API_BASE_URL != ''
        run: |
          node --input-type=module -e "const u=new URL(process.env.KURALI_API_BASE_URL); if (u.protocol !== 'https:' || u.hostname !== 'kuraliupdates-bazaar.onrender.com' || u.pathname.replace(/\\/+$/, '') !== '/api/v1') { console.error('Refusing API smoke against a non-designated staging API'); process.exit(1); }"
      - name: Run read-only API smoke checks
        if: env.KURALI_API_BASE_URL != ''
        run: node scripts/production-smoke.mjs
      - name: Run browser E2E tests
        run: bunx playwright test
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize authenticated role E2E readiness
        if: always()
        shell: bash
        run: |
          {
            echo "## Authenticated role E2E readiness"
            echo
            echo "This is a configuration summary, not proof that a role journey passed. Inspect the Playwright results above for actual pass/skip counts."
            echo
            if [ "$E2E_ENVIRONMENT" = "staging" ] && [ -n "$E2E_API_BASE_URL" ] && [ "${#E2E_OTP_CAPTURE_TOKEN}" -ge 32 ]; then
              echo "- Staging target, API target and OTP capture token: configured"
            else
              echo "- Staging target, API target and OTP capture token: incomplete; authenticated role tests may be skipped"
            fi
            echo
            echo "| Role | Dedicated identity configured |"
            echo "|---|---|"
            for role in BUYER SELLER DELIVERY PROVIDER ADMIN; do
              var="E2E_${role}_IDENTITY"
              if [ -n "${!var}" ]; then
                echo "| ${role} | Yes |"
              else
                echo "| ${role} | No |"
              fi
            done
            echo
            echo "No identity or token values are printed by this summary."
          } >> "$GITHUB_STEP_SUMMARY"
