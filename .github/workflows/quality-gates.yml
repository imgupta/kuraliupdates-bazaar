name: Seller registration quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/seller-registration-redesign"]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: TypeScript checks
        run: bun run lint
      - name: Production build
        run: bun run build

  backend:
    name: Spring Boot verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java-spring
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven verification
        run: mvn --batch-mode --no-transfer-progress clean verify
        env:
          ORACLE_JDBC_URL: jdbc:oracle:thin:@ci-only.invalid
          ORACLE_USERNAME: ci-placeholder-user
          ORACLE_PASSWORD: ci-placeholder-no-connection
          WALLET_PASSWORD: ci-placeholder-wallet-no-connection
          JWT_SECRET: ci-placeholder-0123456789-0123456789-0123456789
          ORACLE_WALLET_DIR: ${{ github.workspace }}/backend-java-spring/src/test/resources/oracle-wallet-fixture
      - name: Docker image wallet-content verification
        run: python3 scripts/verify-wallet-image.py
