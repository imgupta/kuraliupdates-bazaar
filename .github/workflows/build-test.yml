name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install
      - name: TypeScript checks
        run: bun run lint
      - name: Delivery OTP input validator regression
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const src=fs.readFileSync('src/components/Delivery/DeliveryDashboard.tsx','utf8'); if (!src.includes('/^\\\\d{4}$/.test(enteredOtp.trim())')) { console.error('Delivery OTP validator must accept exactly four digits.'); process.exit(1); } if (src.includes('/^\\\\\\\\d{4}$/.test(enteredOtp.trim())')) { console.error('Delivery OTP validator is over-escaped.'); process.exit(1); }"
      - name: Production build
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run delivery OTP authorization and cooldown regression tests
        working-directory: backend-java-spring
        run: mvn --batch-mode --no-transfer-progress -Dtest=DeliveryServiceTest,DeliveryTrackingServiceTest test
      - name: Compile and run full backend verification suite
        working-directory: backend-java-spring
        run: mvn --batch-mode --no-transfer-progress clean verify
