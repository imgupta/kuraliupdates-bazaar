name: iOS app quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-app-check.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-app-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-app:
    name: Typecheck and export native iOS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo native dependencies
        run: npx expo install --fix
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Export iOS bundle
        run: npm run export:ios
