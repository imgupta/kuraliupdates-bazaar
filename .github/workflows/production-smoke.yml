name: Production smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/production-smoke.mjs"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe production API (read-only)
        env:
          KURALI_API_BASE_URL: https://kuraliupdates-bazaar.onrender.com/api/v1
          SMOKE_READINESS_TIMEOUT_MS: "360000"
          SMOKE_RETRY_INTERVAL_MS: "10000"
          SMOKE_TIMEOUT_MS: "20000"
        run: node scripts/production-smoke.mjs
