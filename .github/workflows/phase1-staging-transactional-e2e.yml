name: Phase 1 Staging Transactional E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_staging_mutations:
        description: 'I confirm these dedicated staging test accounts may create and clean up staging orders and Daily Help bookings'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Share the single staging mutation lane with the main CI/E2E workflow.
concurrency:
  group: kuraliupdates-single-staging-e2e
  cancel-in-progress: false

jobs:
  transactional-e2e:
    name: Synthetic COD order and Daily Help lifecycle
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_staging_mutations == true)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      E2E_ENVIRONMENT: staging
      E2E_BASE_URL: https://bazaar.kuraliupdates.com
      E2E_API_BASE_URL: https://kuraliupdates-bazaar.onrender.com/api/v1
      E2E_STAGING_CONFIG_JSON: ${{ secrets.E2E_STAGING_CONFIG_JSON }}
      E2E_TRANSACTIONAL_FLOWS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install
      - name: Install Playwright test runner
        run: bun add --dev @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Load and validate staging-only synthetic fixture configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.E2E_STAGING_CONFIG_JSON;
          if (!raw?.trim()) throw new Error('Missing E2E_STAGING_CONFIG_JSON; no staging request was made.');
          let config;
          try { config = JSON.parse(raw); } catch { throw new Error('E2E_STAGING_CONFIG_JSON is not valid JSON.'); }
          const api = new URL(process.env.E2E_API_BASE_URL);
          if (config.E2E_ENVIRONMENT !== 'staging' || api.protocol !== 'https:' ||
              api.hostname !== 'kuraliupdates-bazaar.onrender.com' || api.pathname !== '/api/v1') {
            throw new Error('Refusing transactional tests against a non-designated staging target.');
          }
          const required = ['E2E_FLOW_AUTH_TOKEN','E2E_BUYER_IDENTITY','E2E_SELLER_IDENTITY',
            'E2E_DELIVERY_IDENTITY','E2E_PROVIDER_IDENTITY','E2E_ADMIN_IDENTITY','E2E_FLOW_BUYER_PHONE','E2E_FLOW_BUYER_EMAIL',
            'E2E_FLOW_SELLER_ID','E2E_FLOW_DELIVERY_AGENT_ID'];
          for (const key of required) if (!String(config[key] ?? '').trim()) throw new Error('Missing required staging E2E configuration key: ' + key);
          const identityKeys = ['E2E_BUYER_IDENTITY','E2E_SELLER_IDENTITY','E2E_DELIVERY_IDENTITY','E2E_PROVIDER_IDENTITY','E2E_ADMIN_IDENTITY'];
          const normalizedIdentities = identityKeys.map(key => String(config[key]).trim().toLowerCase());
          if (normalizedIdentities.some(value => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) ||
              new Set(normalizedIdentities).size !== 1) {
            throw new Error('All five role identities must be the same configured email account; values are never printed.');
          }
          if (String(config.E2E_FLOW_BUYER_EMAIL).trim().toLowerCase() !== normalizedIdentities[0]) {
            throw new Error('E2E_FLOW_BUYER_EMAIL must match the shared five-role account email.');
          }
          if (config.E2E_TRANSACTIONAL_FLOWS_ENABLED !== true) throw new Error('Transactional staging tests are not explicitly enabled in the owner-approved secret.');
          if (config.E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED !== true) throw new Error('Refusing to start: synthetic OTP email suppression has not been explicitly confirmed.');
          if (String(config.E2E_OTP_CAPTURE_TOKEN ?? '').length < 32) throw new Error('E2E_OTP_CAPTURE_TOKEN must contain at least 32 characters.');
          if (String(config.E2E_FLOW_AUTH_TOKEN).length < 32) throw new Error('E2E_FLOW_AUTH_TOKEN must contain at least 32 characters.');
          const profileIds = ['E2E_FLOW_SELLER_ID','E2E_FLOW_DELIVERY_AGENT_ID'].map(key => String(config[key]).trim());
          if (new Set(profileIds).size !== profileIds.length) throw new Error('Seller, delivery-agent and professional staging profile IDs must be distinct.');
          if (profileIds.some(id => id.length > 128 || !/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(id))) throw new Error('Staging test profile IDs must be valid dedicated staging IDs of 128 characters or fewer.');
          // A single dedicated staging login may be issued distinct role-scoped E2E tokens.
          // The lifecycle spec verifies authorization using the ADMIN and SELLER role claims separately.
          const values = {
            E2E_FLOW_AUTH_TOKEN: String(config.E2E_FLOW_AUTH_TOKEN),
            E2E_BUYER_IDENTITY: String(config.E2E_BUYER_IDENTITY),
            E2E_SELLER_IDENTITY: String(config.E2E_SELLER_IDENTITY),
            E2E_DELIVERY_IDENTITY: String(config.E2E_DELIVERY_IDENTITY),
            E2E_PROVIDER_IDENTITY: String(config.E2E_PROVIDER_IDENTITY),
            E2E_ADMIN_IDENTITY: String(config.E2E_ADMIN_IDENTITY ?? ''),
            E2E_FLOW_BUYER_PHONE: String(config.E2E_FLOW_BUYER_PHONE),
            E2E_FLOW_BUYER_EMAIL: String(config.E2E_FLOW_BUYER_EMAIL),
            E2E_FLOW_SELLER_ID: String(config.E2E_FLOW_SELLER_ID),
            E2E_FLOW_DELIVERY_AGENT_ID: String(config.E2E_FLOW_DELIVERY_AGENT_ID),
            E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED: String(config.E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED === true || config.E2E_OTP_EMAIL_SUPPRESSION_CONFIRMED === 'true'),
            E2E_OTP_CAPTURE_TOKEN: String(config.E2E_OTP_CAPTURE_TOKEN ?? '')
          };
          for (const [key,value] of Object.entries(values)) {
            if (value) console.log('::add-mask::' + value.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'));
          }
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([k,v]) => k + '=' + v).join('\n') + '\n');
          console.log('Validated pinned staging target, strong flow token and dedicated staging test profiles. Secret values were masked.');
          NODE
      - name: Wait for database-backed staging readiness
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.E2E_API_BASE_URL + '/health';
          const deadline = Date.now() + 8 * 60 * 1000;
          const requiredStableChecks = 12; // two minutes of continuous health after Render finishes swapping instances
          let stableChecks = 0;
          let last = 'no response';
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000), headers: { 'Cache-Control': 'no-store' } });
              const body = await response.json().catch(() => ({}));
              if (response.ok && body.status === 'UP' && body.database === 'UP') {
                stableChecks++;
                if (stableChecks >= requiredStableChecks) {
                  console.log('PASS: staging API and database remained healthy for two continuous minutes after deployment.');
                  process.exit(0);
                }
                console.log('Staging healthy (' + stableChecks + '/' + requiredStableChecks + '); waiting for deployment stability.');
              } else {
                stableChecks = 0;
                last = 'HTTP ' + response.status + ', database=' + String(body.database ?? 'unknown');
              }
            } catch { stableChecks = 0; last = 'network or timeout'; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Database-backed staging readiness did not remain healthy for two minutes within eight minutes; last result: ' + last);
          NODE
      - name: Run real application order and Daily Help lifecycle tests
        run: bunx playwright test e2e/order-daily-help-lifecycle.spec.ts
      - name: Upload transactional E2E report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-staging-transactional-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
