name: Staging Role and Fixture Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/staging-role-fixture-preflight.yml'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/E2eAuthController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/service/AuthService.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/BuyerController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/DailyHelpController.java'
  push:
    branches: [main, phase1/staging-preflight-verified]
    paths:
      - '.github/workflows/staging-role-fixture-preflight.yml'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/E2eAuthController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/service/AuthService.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/BuyerController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/DailyHelpController.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuraliupdates-staging-role-fixture-preflight
  cancel-in-progress: false

jobs:
  role-and-fixture-preflight:
    name: Verify role sessions and synthetic fixtures without business mutations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_STAGING_CONFIG_JSON: ${{ secrets.E2E_STAGING_CONFIG_JSON }}
      E2E_API_BASE_URL: https://kuraliupdates-bazaar.onrender.com/api/v1
    steps:
      - name: Check all configured role sessions and read synthetic fixtures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          const raw = process.env.E2E_STAGING_CONFIG_JSON;
          if (!raw?.trim()) {
            console.error('Missing E2E_STAGING_CONFIG_JSON; no request was made.');
            process.exit(1);
          }
          let config;
          try { config = JSON.parse(raw); } catch {
            console.error('E2E_STAGING_CONFIG_JSON is invalid JSON; no request was made.');
            process.exit(1);
          }

          const apiBase = process.env.E2E_API_BASE_URL;
          const api = new URL(apiBase);
          const sharedToken = String(config.E2E_FLOW_AUTH_TOKEN ?? '');
          if (config.E2E_ENVIRONMENT !== 'staging' ||
              api.protocol !== 'https:' ||
              api.hostname !== 'kuraliupdates-bazaar.onrender.com' ||
              api.pathname !== '/api/v1' ||
              sharedToken.length < 32) {
            console.error('Staging target or shared flow-token configuration is invalid; no request was made.');
            process.exit(1);
          }
          console.log('::add-mask::' + sharedToken.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));

          const required = (key) => {
            const value = String(config[key] ?? '').trim();
            if (!value) throw new Error('Required E2E config key is blank: ' + key);
            return value;
          };
          const identityKeys = ['E2E_BUYER_IDENTITY','E2E_SELLER_IDENTITY','E2E_DELIVERY_IDENTITY','E2E_PROVIDER_IDENTITY','E2E_ADMIN_IDENTITY'];
          const normalizedIdentities = identityKeys.map(key => required(key).toLowerCase());
          if (normalizedIdentities.some(value => !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value)) ||
              new Set(normalizedIdentities).size !== 1) {
            throw new Error('All five role identities must be the same configured email account; values are never printed.');
          }
          if (required('E2E_FLOW_BUYER_EMAIL').toLowerCase() !== normalizedIdentities[0]) {
            throw new Error('E2E_FLOW_BUYER_EMAIL must match the shared five-role account email.');
          }
          // Match the CI workflow's trusted-event gate: pushes/PRs must never
          // run transactional fixture validation, even if the stored secret opts in.
          const trustedRun = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const transactionalFixturesEnabled = trustedRun && (
            config.E2E_TRANSACTIONAL_FLOWS_ENABLED === true ||
            config.E2E_TRANSACTIONAL_FLOWS_ENABLED === 'true'
          );
          const stagingProfileId = (key) => {
            const value = required(key);
            if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/.test(value)) {
              throw new Error(key + ' must be a valid dedicated staging profile ID.');
            }
            return value;
          };
          for (const key of ['E2E_FLOW_SELLER_ID','E2E_FLOW_DELIVERY_AGENT_ID','E2E_FLOW_PROFESSIONAL_ID']) stagingProfileId(key);
          const expected = [
            ['BUYER', 'E2E_BUYER_IDENTITY', 'BUYER'],
            ['SELLER', 'E2E_SELLER_IDENTITY', 'SELLER'],
            ['DELIVERY', 'E2E_DELIVERY_IDENTITY', 'DELIVERY'],
            ['PROVIDER', 'E2E_PROVIDER_IDENTITY', 'PROFESSIONAL'],
            ['ADMIN', 'E2E_ADMIN_IDENTITY', 'ADMIN']
          ];

          async function postJson(path, headers, body) {
            const response = await fetch(apiBase + path, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json', 'Cache-Control': 'no-store', 'Accept': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
            return response.json();
          }
          async function getJson(path, token) {
            const response = await fetch(apiBase + path, {
              headers: { 'Authorization': 'Bearer ' + token, 'Cache-Control': 'no-store', 'Accept': 'application/json' },
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
            return response.json();
          }

          async function waitForApiLiveness() {
            const deadline = Date.now() + 360000;
            let attempt = 0;
            let lastStatus = 'no response';
            while (Date.now() < deadline) {
              attempt += 1;
              try {
                const response = await fetch(apiBase + '/health/live', {
                  headers: { 'Cache-Control': 'no-store', 'Accept': 'application/json' },
                  signal: AbortSignal.timeout(15000)
                });
                lastStatus = 'HTTP ' + response.status;
                if (response.ok) {
                  const body = await response.json();
                  if (String(body?.status ?? '').toUpperCase() === 'UP') {
                    console.log('PASS: staging API liveness is UP after ' + attempt + ' readiness probe(s).');
                    return;
                  }
                  lastStatus = 'health payload did not report UP';
                }
              } catch (error) {
                lastStatus = error?.name === 'TimeoutError' || error?.name === 'AbortError'
                  ? 'readiness probe timed out'
                  : (error?.message ?? 'request failed');
              }
              console.log('Waiting for staging API startup; readiness probe ' + attempt + ' not ready (' + lastStatus + ').');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Staging API did not become live within 6 minutes; last probe: ' + lastStatus);
          }

          const runId = 'E2E-PREFLIGHT-' + randomUUID();
          console.log('Starting non-transactional staging role preflight.');
          const tokens = {};
          let sessionRequestsStarted = 0;
          const mismatches = [];
          let failure = null;
          try {
            // Render's free instance can cold-start for ~2 minutes. Never send
            // role-token requests until the deployed API has completed startup.
            await waitForApiLiveness();
            for (const [role, identityKey, expectedRole] of expected) {
              const mismatchCountBeforeRole = mismatches.length;
              const identity = required(identityKey);
              console.log('Starting role session check: ' + role + '.');
              sessionRequestsStarted += 1;
              const session = await postJson('/e2e/auth/token', { 'X-E2E-Flow-Token': sharedToken, 'X-E2E-Run-Id': runId }, { role, identifier: identity });
              const reportedRoles = Array.isArray(session?.roles)
                ? session.roles.map(value => String(value).toUpperCase()) : [];
              const missingRoles = ['BUYER','SELLER','DELIVERY','PROFESSIONAL','ADMIN']
                .filter(requiredRole => !reportedRoles.includes(requiredRole));
              if (session?.authenticated !== true ||
                  String(session?.role ?? '').toUpperCase() !== expectedRole ||
                  typeof session?.token !== 'string' || session.token.length < 21 ||
                  missingRoles.length > 0 ||
                  String(session?.user?.email ?? '').trim().toLowerCase() !== normalizedIdentities[0]) {
                throw new Error('Shared account role contract failed for ' + role +
                  (missingRoles.length ? '; missing roles: ' + missingRoles.join(', ') : '') + '.');
              }
              tokens[role] = session.token;
              if (role === 'BUYER') {
                if (String(session.user?.phone ?? '') !== required('E2E_FLOW_BUYER_PHONE') ||
                    String(session.user?.email ?? '').toLowerCase() !== required('E2E_FLOW_BUYER_EMAIL').toLowerCase()) {
                  mismatches.push('BUYER contact identity');
                }
              }
              if (role === 'SELLER') {
                const seller = await getJson('/sellers/me', session.token);
                if (String(seller.sellerId) !== stagingProfileId('E2E_FLOW_SELLER_ID')) mismatches.push('SELLER profile ID');
                if (String(seller.status ?? '').toUpperCase() !== 'APPROVED' || seller.storeOpen !== true) {
                  mismatches.push('SELLER profile is not approved and open');
                }
              }
              if (role === 'DELIVERY') {
                const agent = await getJson('/delivery/me', session.token);
                if (String(agent.agentId) !== stagingProfileId('E2E_FLOW_DELIVERY_AGENT_ID')) mismatches.push('DELIVERY profile ID');
                if (String(agent.status ?? '').toUpperCase() !== 'ACTIVE' || agent.availableForJobs !== true) {
                  mismatches.push('DELIVERY profile is not active and available');
                }
              }
              if (role === 'PROVIDER') {
                const providerPhone = String(session.user?.phone ?? '');
                if (!providerPhone) throw new Error('Provider session did not return a phone for profile verification.');
                const profile = await getJson('/daily-help/professionals/by-phone/' + encodeURIComponent(providerPhone), session.token);
                if (String(profile.professionalId) !== stagingProfileId('E2E_FLOW_PROFESSIONAL_ID')) mismatches.push('PROVIDER profile ID');
                if (Number(profile.verified) !== 1 || String(profile.status ?? '').toUpperCase() !== 'AVAILABLE') {
                  mismatches.push('PROVIDER profile is not verified and available');
                }
              }
              console.log((mismatches.length === mismatchCountBeforeRole ? 'PASS: ' : 'CHECK: ') +
                role + (mismatches.length === mismatchCountBeforeRole
                  ? ' session and corresponding profile identity verified.'
                  : ' session issued; a profile/configuration mismatch was recorded.'));
            }

            const adminQueue = await getJson('/admin/sellers/pending', tokens.ADMIN);
            if (!Array.isArray(adminQueue)) throw new Error('ADMIN role did not return the expected seller approval queue.');
            for (const role of ['BUYER','SELLER']) {
              const denied = await fetch(apiBase + '/admin/sellers/pending', {
                headers: { 'Authorization': 'Bearer ' + tokens[role], 'Cache-Control': 'no-store', 'Accept': 'application/json' },
                signal: AbortSignal.timeout(60000)
              });
              if (![401,403].includes(denied.status)) throw new Error(role + ' session unexpectedly accessed the admin approval queue.');
            }
            console.log('PASS: ADMIN can read approval queue; BUYER and SELLER sessions are denied.');
            if (transactionalFixturesEnabled) {
              console.log('PASS: all three pre-existing profiles are linked to the shared account and ready. Synthetic product, service and slot fixtures are provisioned per transaction run.');
            } else {
              console.log('SKIP: fixture/profile preflight because transactional E2E is disabled. No fixture reads or business mutations were attempted.');
            }
            if (mismatches.length) {
              throw new Error('Fixture/profile checks need configuration fixes: ' + [...new Set(mismatches)].join(', ') + '. No business transactions were attempted.');
            }
            console.log('PASS: the same email account was verified to expose all five role profiles through every role-scoped token.' +
              (transactionalFixturesEnabled ? ' Synthetic fixture checks also passed.' : ' Fixture checks skipped because transactional E2E is disabled.') +
              ' No orders, bookings, inventory changes, OTPs, or customer records were created. Session tokens were not printed.');
          } catch (error) {
            failure = error;
          } finally {
            // Role token issuance persists short-lived sessions. Tag each one to this
            // preflight run and remove only those sessions, even when a role check fails.
            if (sessionRequestsStarted > 0) {
              try {
                console.log('Starting exact run-scoped cleanup for ' + sessionRequestsStarted + ' attempted session request(s); ' + Object.keys(tokens).length + ' response token(s) received.');
                const response = await fetch(apiBase + '/e2e/cleanup/' + encodeURIComponent(runId), {
                  method: 'POST',
                  headers: {
                    'X-E2E-Flow-Token': sharedToken,
                    'Cache-Control': 'no-store',
                    'Accept': 'application/json'
                  },
                  signal: AbortSignal.timeout(60000)
                });
                if (!response.ok) throw new Error('Run-scoped preflight cleanup returned HTTP ' + response.status);
                const cleanup = await response.json();
                const cleanedSessions = Number(cleanup.sessions);
                const receivedTokens = Object.keys(tokens).length;
                if (!Number.isInteger(cleanedSessions) ||
                    cleanedSessions < receivedTokens ||
                    cleanedSessions > sessionRequestsStarted) {
                  throw new Error('Run-scoped cleanup count ' + String(cleanup.sessions) +
                    ' is outside the safe expected range ' + receivedTokens + '..' + sessionRequestsStarted +
                    ' (successful responses..attempted requests).');
                }
                console.log('PASS: run-scoped cleanup removed ' + cleanedSessions +
                  ' session(s); ' + receivedTokens + ' response token(s) received from ' +
                  sessionRequestsStarted + ' attempted request(s). Only this unique run ID was cleaned.');
              } catch (cleanupError) {
                failure = failure ?? cleanupError;
                console.error('PREFLIGHT CLEANUP FAILED: ' + (cleanupError?.message ?? 'unexpected cleanup failure'));
              }
            } else {
              console.log('SKIP: no role-session request was attempted; no run-scoped cleanup was necessary.');
            }
          }
          if (failure) {
            console.error('PREFLIGHT FAILED: ' + (failure?.message ?? 'unexpected failure') + '. No business transactions were attempted.');
            process.exit(1);
          }
          NODE
