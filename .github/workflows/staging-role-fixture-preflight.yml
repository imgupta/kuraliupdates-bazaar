name: Staging Role and Fixture Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/staging-role-fixture-preflight.yml'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/E2eAuthController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/service/AuthService.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/BuyerController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/DailyHelpController.java'
  push:
    branches: [main, phase1/staging-preflight-verified]
    paths:
      - '.github/workflows/staging-role-fixture-preflight.yml'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/E2eAuthController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/service/AuthService.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/BuyerController.java'
      - 'backend-java-spring/src/main/java/com/kuraliupdates/bazaar/controller/DailyHelpController.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuraliupdates-staging-role-fixture-preflight
  cancel-in-progress: false

jobs:
  role-and-fixture-preflight:
    name: Verify role sessions and synthetic fixtures without business mutations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_STAGING_CONFIG_JSON: ${{ secrets.E2E_STAGING_CONFIG_JSON }}
      E2E_API_BASE_URL: https://kuraliupdates-bazaar.onrender.com/api/v1
    steps:
      - name: Check all configured role sessions and read synthetic fixtures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          const raw = process.env.E2E_STAGING_CONFIG_JSON;
          if (!raw?.trim()) {
            console.error('Missing E2E_STAGING_CONFIG_JSON; no request was made.');
            process.exit(1);
          }
          let config;
          try { config = JSON.parse(raw); } catch {
            console.error('E2E_STAGING_CONFIG_JSON is invalid JSON; no request was made.');
            process.exit(1);
          }

          const apiBase = process.env.E2E_API_BASE_URL;
          const api = new URL(apiBase);
          const sharedToken = String(config.E2E_FLOW_AUTH_TOKEN ?? '');
          if (config.E2E_ENVIRONMENT !== 'staging' ||
              api.protocol !== 'https:' ||
              api.hostname !== 'kuraliupdates-bazaar.onrender.com' ||
              api.pathname !== '/api/v1' ||
              sharedToken.length < 32) {
            console.error('Staging target or shared flow-token configuration is invalid; no request was made.');
            process.exit(1);
          }
          console.log('::add-mask::' + sharedToken.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));

          const required = (key) => {
            const value = String(config[key] ?? '').trim();
            if (!value) throw new Error('Required E2E config key is blank: ' + key);
            return value;
          };
          // Match the CI workflow's trusted-event gate: pushes/PRs must never
          // run transactional fixture validation, even if the stored secret opts in.
          const trustedRun = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const transactionalFixturesEnabled = trustedRun && (
            config.E2E_TRANSACTIONAL_FLOWS_ENABLED === true ||
            config.E2E_TRANSACTIONAL_FLOWS_ENABLED === 'true'
          );
          const syntheticFixtureId = (key) => {
            const value = required(key);
            if (!/^E2E-[A-Za-z0-9_-]{3,80}$/.test(value)) {
              throw new Error(key + ' must be a synthetic E2E- fixture ID when transactional E2E is enabled.');
            }
            return value;
          };
          const expected = [
            ['BUYER', 'E2E_BUYER_IDENTITY', 'BUYER'],
            ['SELLER', 'E2E_SELLER_IDENTITY', 'SELLER'],
            ['DELIVERY', 'E2E_DELIVERY_IDENTITY', 'DELIVERY'],
            ['PROVIDER', 'E2E_PROVIDER_IDENTITY', 'PROFESSIONAL'],
            ['ADMIN', 'E2E_ADMIN_IDENTITY', 'ADMIN']
          ];

          async function postJson(path, headers, body) {
            const response = await fetch(apiBase + path, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json', 'Cache-Control': 'no-store', 'Accept': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
            return response.json();
          }
          async function getJson(path, token) {
            const response = await fetch(apiBase + path, {
              headers: { 'Authorization': 'Bearer ' + token, 'Cache-Control': 'no-store', 'Accept': 'application/json' },
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
            return response.json();
          }

          const runId = 'E2E-PREFLIGHT-' + randomUUID();
console.log('Starting non-transactional staging role preflight.');
          const tokens = {};
          const mismatches = [];
          let failure = null;
          try {
            for (const [role, identityKey, expectedRole] of expected) {
              const mismatchCountBeforeRole = mismatches.length;
              const identity = required(identityKey);
              console.log('Starting role session check: ' + role + '.');
      const session = await postJson('/e2e/auth/token', { 'X-E2E-Flow-Token': sharedToken, 'X-E2E-Run-Id': runId }, { role, identifier: identity });
              if (session?.authenticated !== true ||
                  String(session?.role ?? '').toUpperCase() !== expectedRole ||
                  typeof session?.token !== 'string' || session.token.length < 21) {
                throw new Error('Role session contract failed for ' + role + '.');
              }
              tokens[role] = session.token;
              if (role === 'BUYER') {
                if (String(session.user?.phone ?? '') !== required('E2E_FLOW_BUYER_PHONE') ||
                    String(session.user?.email ?? '').toLowerCase() !== required('E2E_FLOW_BUYER_EMAIL').toLowerCase()) {
                  mismatches.push('BUYER contact identity');
                }
              }
              if (transactionalFixturesEnabled && role === 'SELLER') {
                const seller = await getJson('/sellers/me', session.token);
                if (String(seller.sellerId) !== syntheticFixtureId('E2E_FLOW_SELLER_ID')) {
                  mismatches.push('SELLER profile ID');
                }
              }
              if (transactionalFixturesEnabled && role === 'DELIVERY') {
                const agent = await getJson('/delivery/me', session.token);
                if (String(agent.agentId) !== syntheticFixtureId('E2E_FLOW_DELIVERY_AGENT_ID')) {
                  mismatches.push('DELIVERY profile ID');
                }
              }
              if (transactionalFixturesEnabled && role === 'PROVIDER') {
                const providerPhone = String(session.user?.phone ?? '');
                if (!providerPhone) throw new Error('Provider session did not return a phone for profile verification.');
                const profile = await getJson('/daily-help/professionals/by-phone/' + encodeURIComponent(providerPhone), session.token);
                if (String(profile.professionalId) !== syntheticFixtureId('E2E_FLOW_PROFESSIONAL_ID')) {
                  mismatches.push('PROVIDER profile ID');
                }
              }
              console.log((mismatches.length === mismatchCountBeforeRole ? 'PASS: ' : 'CHECK: ') +
                role + (mismatches.length === mismatchCountBeforeRole
                  ? ' session and corresponding profile identity verified.'
                  : ' session issued; a profile/configuration mismatch was recorded.'));
            }

            if (transactionalFixturesEnabled) {
              syntheticFixtureId('E2E_FLOW_SELLER_ID');
              syntheticFixtureId('E2E_FLOW_DELIVERY_AGENT_ID');
              syntheticFixtureId('E2E_FLOW_PROFESSIONAL_ID');
              console.log('PASS: seller, delivery-agent and professional IDs are synthetic. Product, service and slot fixtures are provisioned per transaction run.');
            } else {
              console.log('SKIP: fixture/profile preflight because transactional E2E is disabled. No fixture reads or business mutations were attempted.');
            }
            if (mismatches.length) {
              throw new Error('Fixture/profile checks need configuration fixes: ' + [...new Set(mismatches)].join(', ') + '. No business transactions were attempted.');
            }
            console.log('PASS: all five role sessions verified.' +
              (transactionalFixturesEnabled ? ' Synthetic fixture checks also passed.' : ' Fixture checks skipped because transactional E2E is disabled.') +
              ' No orders, bookings, inventory changes, OTPs, or customer records were created. Session tokens were not printed.');
          } catch (error) {
            failure = error;
          } finally {
            // Role token issuance persists short-lived sessions. Tag each one to this
            // preflight run and remove only those sessions, even when a role check fails.
            try {
              console.log('Starting exact run-scoped cleanup for ' + Object.keys(tokens).length + ' issued sessions.');
      const response = await fetch(apiBase + '/e2e/cleanup/' + encodeURIComponent(runId), {
                method: 'POST',
                headers: {
                  'X-E2E-Flow-Token': sharedToken,
                  'Cache-Control': 'no-store',
                  'Accept': 'application/json'
                },
                signal: AbortSignal.timeout(60000)
              });
              if (!response.ok) throw new Error('Run-scoped preflight cleanup returned HTTP ' + response.status);
              const cleanup = await response.json();
              const expectedSessions = Object.keys(tokens).length;
              if (Number(cleanup.sessions) !== expectedSessions) {
                throw new Error('Expected to clean ' + expectedSessions + ' tagged preflight sessions, cleaned ' + String(cleanup.sessions));
              }
              console.log('PASS: run-scoped cleanup removed ' + cleanup.sessions + ' preflight sessions. No business records were created.');
            } catch (cleanupError) {
              failure = failure ?? cleanupError;
              console.error('PREFLIGHT CLEANUP FAILED: ' + (cleanupError?.message ?? 'unexpected cleanup failure'));
            }
          }
          if (failure) {
            console.error('PREFLIGHT FAILED: ' + (failure?.message ?? 'unexpected failure') + '. No business transactions were attempted.');
            process.exit(1);
          }
          NODE
